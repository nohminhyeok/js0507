<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<script>
		let source = [3, 7, 10];
		
		let copy1 = source; // 얕은 복사
		
		copy1[1] = 99;
		
		console.log('source : ',source);
		
		let copy2 = new Array(source.length); // 깊은 복사 반복문 활용
		for(let i=0; i<copy2.length; i++){
			copy2[i] = source[i];
		}
		console.log('copy2 : ',copy2);
		copy2[1] = 7;
		console.log('copy2 : ',copy2);
		console.log('source : ',source);
		
		let copy3 = [...source]; // 전개 연산자를 사용하면 반복문 없이 깊은 복사가 가능하다.
		console.log('copy3 : ',copy3);
		copy3[1] = 9;
		
		console.log('source : ',source)
	</script>
</body>
</html>
