<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>핀볼 로또 추첨기 - 액션 강화</title>
  <style>
    body {
      background: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    canvas {
      background: #ffffff;
      display: block;
      margin: 0 auto;
      border: 2px solid #333;
    }

    .tray {
      margin: 20px auto;
      width: 400px;
      height: 70px;
      background-color: #333;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .tray-ball {
      width: 50px;
      height: 50px;
      line-height: 50px;
      border-radius: 50%;
      font-size: 1.2rem;
      text-align: center;
      font-weight: bold;
      color: #fff;
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>🎯 핀볼 로또 추첨기 - 액션 강화</h1>
  <canvas id="pinball" width="400" height="600"></canvas>
  <div class="tray" id="tray">당첨 번호: </div>
  <script>
    const canvas = document.getElementById('pinball');
    const ctx = canvas.getContext('2d');
    const tray = document.getElementById('tray');

    const balls = [];
    const obstacles = [];
    const selectedBalls = [];
    const totalBalls = 45;
    const gravity = 0.3; 
    const bounceDamping = 0.8; 
    const maxSpeed = 5; 

    // 공 클래스
    class Ball {
      constructor(number) {
        this.number = number;
        this.x = Math.random() * canvas.width;
        this.y = 0;
        this.radius = 15;
        this.color = 'hsl(' + Math.random() * 360 + ', 100%, 50%)';
        this.vx = (Math.random() - 0.5) * maxSpeed;
        this.vy = Math.random() * maxSpeed + 2;
        this.reachedBottom = false;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.number, this.x, this.y);
      }

      update() {
        this.vy += gravity;
        this.x += this.vx;
        this.y += this.vy;

        // 벽 충돌
        if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
          this.vx *= -1;
        }

        // 바닥 도착
        if (this.y + this.radius > canvas.height) {
          this.vy *= -bounceDamping;
          this.y = canvas.height - this.radius;
          if (!this.reachedBottom) {
            this.reachedBottom = true;
            if (selectedBalls.length < 6) {
              selectedBalls.push(this.number);
              addToTray(this.number, this.color);
            }
          }
        }

        // 장애물 충돌
        for (let obs of obstacles) {
          const dx = this.x - obs.x;
          const dy = this.y - obs.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < this.radius + obs.radius) {
            this.vx = (Math.random() - 0.5) * maxSpeed;
            this.vy = -Math.random() * maxSpeed;
            this.vy *= bounceDamping;
            this.x += this.vx * 2;
            this.y += this.vy * 2;
            this.shake();
          }
        }
      }

      shake() {
        const originalX = this.x;
        const originalY = this.y;
        this.x += (Math.random() - 0.5) * 4;
        this.y += (Math.random() - 0.5) * 4;
        setTimeout(() => {
          this.x = originalX;
          this.y = originalY;
        }, 50);
      }
    }

    // 장애물 클래스
    class Obstacle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 8;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#555';
        ctx.fill();
      }
    }

    // 장애물 생성
    for (let y = 100; y < 500; y += 60) {
      for (let x = 50; x < 400; x += 50) {
        obstacles.push(new Obstacle(x, y));
      }
    }

    // 공 생성
    for (let i = 1; i <= totalBalls; i++) {
      balls.push(new Ball(i));
    }

    function addToTray(number, color) {
      const trayBall = document.createElement('div');
      trayBall.classList.add('tray-ball');
      trayBall.style.backgroundColor = color;
      trayBall.textContent = number;
      tray.appendChild(trayBall);

      if (selectedBalls.length === 6) {
        alert('당첨 번호: ' + selectedBalls.join(', '));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let obs of obstacles) {
        obs.draw();
      }

      for (let ball of balls) {
        ball.update();
        ball.draw();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
