<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<script>
		let arr1 = new Array(); // Array class의 생성자와 new 연산자를 사용하여 배열(객체) 생성
		let arr2 = []; // 배열 리터럴을 사용하여 배열 생성
		
		let obj1 = new Object(); // Object class의 생성자와 new 연산자를 사용하여 객체 생성
		let obj2 = {}; // 객체 리터럴을 사용하여 객체 생성
		
		let s1 = {name:'루피', age:19};
		console.log(s1.name,s1.age);
		s1.gender = '남'; // 동적 타입
		console.log(s1.name,s1.age,s1.gender);
		
		let s2 = {name:'조로', age:22};
		console.log(s2.name, s2.age);
		
		let Person = function(_name, _age) { // 객체 지향 패러다임의 생성자를 흉내낸 함수 (자바스크립트에 클래스 문법이 없을때), 생성자 역할을 함수는 보통 대문자로 맹긂
			return {name:_name, age:_age}
		}
		
		let s3 = Person('나미', 21);
		console.log(s3.name, s3.age);
	</script>
</body>
</html>
